limit_req_zone $binary_remote_addr zone=sahmat_auth:10m rate=5r/m;

server {
    listen 80;
    server_name sahmatkpss.com www.sahmatkpss.com;
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location ~ ^/api/(auth/(login|register)|admin/auth)$ {
        limit_req zone=sahmat_auth burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /uploads/questions/ {
        alias /var/www/sahmatkpss-uploads/questions/;
        autoindex off;
    }
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
